name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @otterly/markdown-editor check
      - run: pnpm lint
      - run: pnpm test
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            toolchain_targets: x86_64-unknown-linux-gnu
            build_target: x86_64-unknown-linux-gnu
            bundle: appimage
          - os: macos-latest
            target: aarch64-apple-darwin
            toolchain_targets: aarch64-apple-darwin,x86_64-apple-darwin
            build_target: universal-apple-darwin
            bundle: app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            toolchain_targets: x86_64-pc-windows-msvc
            build_target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchain_targets }}
      - name: Match the Tauri macOS compiler environment
        if: runner.os == 'macOS'
        run: |
          node -e "const c=require('./src-tauri/tauri.conf.json'); const v=c.bundle?.macOS?.minimumSystemVersion; if(v!==null) require('fs').appendFileSync(process.env.GITHUB_ENV,'MACOSX_DEPLOYMENT_TARGET='+(v||'10.13')+'\n');"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: native-${{ runner.os }}-${{ matrix.build_target }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: true
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        if: runner.os == 'Linux'
      # These builds also warm release dependencies on main, where tags can reuse them.
      - name: Build native desktop bundle
        if: runner.os != 'Linux'
        run: pnpm tauri build --target ${{ matrix.build_target }} --bundles ${{ matrix.bundle }} --config src-tauri/tauri.smoke.conf.json -- --locked
      - run: cargo test --release --features tauri/custom-protocol --locked --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml
      - name: Checkout CLI for native Windows integration
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: lpmasser/work-ontology
          path: .ci/work-ontology
      - name: Install CLI dependencies
        if: runner.os == 'Windows'
        working-directory: .ci/work-ontology
        run: npm ci
      - name: Install, launch and safely quit on Windows
        if: runner.os == 'Windows'
        run: node scripts/windows_smoke.mjs src-tauri/target/${{ matrix.target }}/release/bundle/nsis .ci/work-ontology
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-smoke
          path: windows-smoke.json
          if-no-files-found: ignore
  windows_cli:
    name: Windows CLI and synchronization
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lpmasser/work-ontology
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
