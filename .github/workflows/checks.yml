name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @otterly/markdown-editor check
      - run: pnpm lint
      - run: pnpm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build native Windows installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.smoke.conf.json -- --locked
      - name: Checkout CLI for native Windows integration
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: lpmasser/work-ontology
          path: .ci/work-ontology
      - name: Test native CLI and synchronization
        if: runner.os == 'Windows'
        working-directory: .ci/work-ontology
        run: |
          npm ci
          npm test
      - name: Install, launch and safely quit on Windows
        if: runner.os == 'Windows'
        run: node scripts/windows_smoke.mjs src-tauri/target/release/bundle/nsis .ci/work-ontology
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-smoke
          path: windows-smoke.json
          if-no-files-found: ignore
