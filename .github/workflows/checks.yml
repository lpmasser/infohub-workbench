name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            frontend: true
          - os: macos-latest
            target: aarch64-apple-darwin
            frontend: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            frontend: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            frontend: false
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: native-${{ runner.os }}-${{ matrix.target }}
          cache-on-failure: true
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        if: matrix.frontend
      - run: pnpm --filter @otterly/markdown-editor check
        if: matrix.frontend
      - run: pnpm lint
        if: matrix.frontend
      - run: pnpm test
        if: matrix.frontend
      - run: pnpm build
        if: runner.os != 'Windows'
      # Tauri builds the Windows frontend once; native tests reuse that output.
      - name: Build native Windows installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles nsis --config src-tauri/tauri.smoke.conf.json -- --locked
      # Exercise native behavior and warm the same dependency profile as releases.
      - run: cargo test --release --features tauri/custom-protocol --locked --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml
      - name: Checkout CLI for native Windows integration
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: lpmasser/work-ontology
          path: .ci/work-ontology
      - name: Install CLI dependencies
        if: runner.os == 'Windows'
        working-directory: .ci/work-ontology
        run: npm ci
      - name: Install, launch and safely quit on Windows
        if: runner.os == 'Windows'
        run: node scripts/windows_smoke.mjs src-tauri/target/${{ matrix.target }}/release/bundle/nsis .ci/work-ontology
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-smoke
          path: windows-smoke.json
          if-no-files-found: ignore
  windows_cli:
    name: Windows CLI and synchronization
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lpmasser/work-ontology
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
