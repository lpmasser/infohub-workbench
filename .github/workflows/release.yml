name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build:
    needs: checks
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # The official action merges platform entries into latest.json. Serialize
      # writers so one platform cannot overwrite another platform's entry.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app
          - os: windows-latest
            targets: ""
            args: --bundles nsis
          - os: ubuntu-22.04
            targets: ""
            args: --bundles appimage
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches application version
        run: node -e "const c=require('./package.json'); if(process.env.GITHUB_REF_NAME!=='v'+c.version) throw Error('Tag and app version differ');"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: InfoHub Workbench ${{ github.ref_name }}
          releaseBody: Signed desktop update for macOS, Windows and Linux.
          releaseDraft: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} -- --locked
          retryAttempts: 2
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate complete manifest and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json
          node -e "const m=require('./latest.json'); for(const p of ['darwin-aarch64','darwin-x86_64','windows-x86_64','linux-x86_64']) { if(!m.platforms[p]?.signature || !m.platforms[p]?.url) throw Error('Missing target '+p); } if('v'+m.version !== process.env.RELEASE_TAG) throw Error('Version mismatch');"
          gh release edit "$RELEASE_TAG" --draft=false --latest
