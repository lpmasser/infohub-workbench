name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  checked_commit:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      passed: ${{ steps.checks.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse successful main Checks for this exact commit
        id: checks
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'checks.yml', branch: 'main',
              head_sha: sha, event: 'push', per_page: 1
            });
            const run = data.workflow_runs[0];
            const passed = run?.head_sha === sha && run?.status === 'completed' && run?.conclusion === 'success';
            core.setOutput('passed', String(passed));
            await core.summary.addRaw(passed ? `Reusing main Checks: ${run.html_url}` : 'No successful main Checks for this commit; running Checks before building.').write();
  checks:
    needs: checked_commit
    if: needs.checked_commit.outputs.passed != 'true'
    uses: ./.github/workflows/checks.yml
  prepare:
    needs: [checked_commit, checks]
    if: ${{ !cancelled() && needs.checked_commit.result == 'success' && (needs.checked_commit.outputs.passed == 'true' || needs.checks.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and create a draft
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const version = JSON.parse(fs.readFileSync('package.json')).version;
            const tag = context.ref.replace('refs/tags/', '');
            if (tag !== `v${version}`) throw Error('Tag and app version differ');
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const matches = releases.filter(release => release.tag_name === tag);
            if (matches.length > 1) throw Error(`Multiple releases for ${tag}`);
            const release = matches[0] ?? (await github.rest.repos.createRelease({ ...context.repo, tag_name: tag,
              name: `InfoHub Workbench ${tag}`, body: 'Signed desktop update for macOS, Windows and Linux.', draft: true })).data;
            if (!release.draft) throw Error('Refusing to overwrite a published release');
            core.setOutput('id', release.id);
  build:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: app
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: native-${{ runner.os }}-${{ matrix.target }}
          cache-on-failure: true
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          # Bundles have distinct names; only the final job writes latest.json.
          assetNamePattern: ${{ matrix.target }}[ext]
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
          retryAttempts: 2
  publish:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish one complete updater manifest
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        with:
          script: |
            const version = JSON.parse(require('node:fs').readFileSync('package.json')).version;
            const release_id = Number(process.env.RELEASE_ID);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id, per_page: 100 });
            const targets = {
              'darwin-aarch64': 'aarch64-apple-darwin', 'darwin-x86_64': 'x86_64-apple-darwin',
              'windows-x86_64': 'x86_64-pc-windows-msvc', 'linux-x86_64': 'x86_64-unknown-linux-gnu'
            };
            const platforms = {};
            for (const [platform, target] of Object.entries(targets)) {
              const signatures = assets.filter(a => a.name.startsWith(target) && a.name.endsWith('.sig'));
              if (signatures.length !== 1) throw Error(`Expected one signed bundle for ${target}`);
              const sig = signatures[0];
              const bundle = assets.find(a => a.name === sig.name.slice(0, -4));
              if (!bundle) throw Error(`Missing bundle for ${target}`);
              const response = await github.rest.repos.getReleaseAsset({ ...context.repo, asset_id: sig.id, headers: { accept: 'application/octet-stream' } });
              const signature = Buffer.from(response.data).toString().trim();
              if (!signature) throw Error(`Empty signature for ${target}`);
              platforms[platform] = { signature, url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/releases/download/v${version}/${encodeURIComponent(bundle.name)}` };
            }
            const data = JSON.stringify({ version, notes: `InfoHub Workbench ${version}`, pub_date: new Date().toISOString(), platforms });
            const old = assets.find(a => a.name === 'latest.json');
            if (old) await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: old.id });
            await github.rest.repos.uploadReleaseAsset({ ...context.repo, release_id, name: 'latest.json', data, headers: { 'content-type': 'application/json', 'content-length': Buffer.byteLength(data) } });
            await github.rest.repos.updateRelease({ ...context.repo, release_id, draft: false, make_latest: 'true' });
